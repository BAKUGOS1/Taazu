<!doctype html>
<html><head><meta charset="utf-8"><title>Taazu Reel 2</title>
<link rel="stylesheet" href="assets/fonts/local.css">
<style>
:root{--cream:#FFF8E7;--orange:#EA580C;--yellow:#F5D83B;--green:#1F7A3A;--brown:#8A4B1F}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
.layer{position:absolute;inset:0}
.abs{position:absolute;left:0;top:0;will-change:transform,opacity}
.txt{position:absolute;left:0;width:1080px;text-align:center;white-space:nowrap}
.bc{font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase}
.bl{font-family:'Baloo 2',sans-serif;font-weight:800}
.pp{font-family:'Poppins',sans-serif;font-weight:700}
.bottle{position:absolute;width:400px;height:1010px;left:0;top:0;transform-origin:200px 1000px}
</style></head>
<body><div id="stage">
  <div id="bg" class="layer"></div>
  <svg id="rays" class="layer" viewBox="0 0 1080 1920"></svg>
  <div id="items" class="layer"></div>
  <svg id="fx" class="layer" viewBox="0 0 1080 1920"></svg>
  <div id="bottles" class="layer"></div>
  <div id="items2" class="layer"></div>
  <img id="drop" class="abs" src="assets/drop_solid.png" style="width:310px">
  <img id="word" class="abs" src="assets/wordmark.png" style="width:720px">
  <div id="texts" class="layer"></div>
  <div id="flash" class="layer" style="background:#fff;opacity:0"></div>
</div>
<script>
const DUR=30;let RT=0;
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,p)=>a+(b-a)*p;
const eOut=p=>1-Math.pow(1-p,3), eIn=p=>p*p*p, eIO=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const eBack=p=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
const eEl=p=>p<=0?0:p>=1?1:Math.pow(2,-10*p)*Math.sin((p*10-.75)*(2*Math.PI)/3)+1;
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const NS='http://www.w3.org/2000/svg';
function el(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function img(src,w,parent='items'){const i=document.createElement('img');i.src='assets/'+src;i.className='abs';i.style.width=w+'px';$(parent).appendChild(i);return i}
// place image centred at (x,y)
function put(e,o,x,y,s=1,r=0,w){if(o<=0.001){e.style.display='none';return}e.style.display='block';e.style.opacity=o;const W=w||parseFloat(e.style.width);const H=e.naturalHeight?W*e.naturalHeight/e.naturalWidth:W;e.style.transform=`translate(${x-W/2}px,${y-H/2}px) rotate(${r}deg) scale(${s})`}
function T(html,cls,top,style=''){const d=document.createElement('div');d.className='txt '+cls;d.style.cssText=`top:${top}px;${style}`;d.innerHTML=html;$('texts').appendChild(d);return d}
function show(e,o,x=0,y=0,s=1,extra=''){e.style.display=o<=0.001?'none':'block';e.style.opacity=o;e.style.transform=`translate(${x}px,${y}px) scale(${s}) ${extra}`}

/* ---------- texts (all inside the Reels safe zone: y 300..1250, x 65..960) ---------- */
const tx={
  q:T('<span style="background:var(--cream);color:var(--brown);padding:14px 44px;border-radius:70px;box-shadow:0 8px 24px rgba(0,0,0,.12)">Andar kya hai?</span>','pp',320,'font-size:70px'),
  w1:T('NIMBU','bc',1010,'font-size:230px;letter-spacing:18px;color:var(--green)'),
  w2:T('NAMAK','bc',1010,'font-size:230px;letter-spacing:18px;color:#FFFFFF'),
  w3:T('JEERA','bc',1010,'font-size:230px;letter-spacing:18px;color:var(--brown)'),
  w4:T('PUDINA','bc',1010,'font-size:230px;letter-spacing:16px;color:var(--green)'),
  w5:T('THANDA','bc',1010,'font-size:230px;letter-spacing:16px;color:#1F6FA3'),
  eq:T('<span style="background:var(--cream);color:var(--brown);padding:14px 44px;border-radius:70px;box-shadow:0 8px 24px rgba(0,0,0,.12)">Ek ghoont mein sab</span>','pp',320,'font-size:66px'),
  c1:T('CLASSIC','bc',300,'font-size:120px;letter-spacing:14px;color:var(--green)'),
  c2:T('NIMBU NAMAK','bc',410,'font-size:150px;letter-spacing:6px;color:var(--orange)'),
  j1:T('JEERA','bc',300,'font-size:130px;letter-spacing:18px;color:var(--yellow)'),
  j2:T('MASALA','bc',420,'font-size:150px;letter-spacing:14px;color:var(--cream)'),
  r1:T('REHYDRATE','bc',300,'font-size:140px;letter-spacing:10px;color:var(--cream)'),
  r2:T('REFRESH','bc',440,'font-size:140px;letter-spacing:10px;color:var(--yellow)'),
  r3:T('RECOVER','bc',580,'font-size:140px;letter-spacing:10px;color:var(--cream)'),
  tag:T('REHYDRATE&nbsp;|&nbsp;REFRESH&nbsp;|&nbsp;RECOVER','bc',935,'font-size:58px;letter-spacing:8px;color:var(--orange);font-weight:700'),
  cta:T('<span style="background:var(--green);color:var(--cream);padding:20px 48px;border-radius:80px;display:inline-block">Navratri pe milenge!</span>','pp',1025,'font-size:52px'),
  wa:T('WhatsApp: 91730 86652','pp',1150,'font-size:50px;color:var(--orange)'),
  fl:T('Classic Nimbu Namak &nbsp;·&nbsp; Jeera Masala &nbsp;·&nbsp; No fizz','pp',1222,'font-size:32px;color:var(--brown);font-weight:500'),
};

/* ---------- ingredient elements ---------- */
const lemon=img('lemon_wedge.png',420);
const R=rng(11);
// salt crystals: small faceted translucent polygons
const fx=$('fx');const defs=el('defs',{},fx);
const sg=el('linearGradient',{id:'salt',x1:0,y1:0,x2:1,y2:1},defs);[['0','#FFFFFF'],['.5','#EEF3F7'],['1','#C9D3DC']].forEach(([o,c])=>el('stop',{offset:o,'stop-color':c},sg));
const sp=el('linearGradient',{id:'saltp',x1:0,y1:0,x2:1,y2:1},defs);[['0','#FFF1F4'],['1','#E8B7C4']].forEach(([o,c])=>el('stop',{offset:o,'stop-color':c},sp));
const salts=[];const saltG=el('g',{},fx);
for(let i=0;i<90;i++){const n=5+Math.floor(R()*3),r=18+R()*30;let d='';for(let k=0;k<n;k++){const a=k/n*Math.PI*2+R()*.5,rr=r*(.7+R()*.4);d+=(k?'L':'M')+(Math.cos(a)*rr).toFixed(1)+' '+(Math.sin(a)*rr).toFixed(1)}
  const g=el('g',{},saltG);el('path',{d:d+'Z',fill:i%6===0?'url(#saltp)':'url(#salt)',stroke:'#fff','stroke-width':2,opacity:.95},g);el('path',{d:`M${-r*.3} ${-r*.4} L${r*.1} ${-r*.5}`,stroke:'#fff','stroke-width':3,'stroke-linecap':'round'},g);
  salts.push({g,x:200+R()*680,land:640+R()*220,delay:R()*0.9,rot:R()*360,sp:(R()-.5)*300})}
// splash droplets
const drops=[];for(let i=0;i<26;i++){drops.push({a:-Math.PI*(0.1+R()*0.8),v:500+R()*800,r:6+R()*14,e:el('circle',{fill:'#E9F6FF',stroke:'#A9D6F5','stroke-width':2},fx)})}
const ring=el('ellipse',{cx:540,cy:760,rx:0,ry:0,fill:'none',stroke:'#9ED2F2','stroke-width':10},fx);
// jeera seeds, mint leaves, ice cubes (images)
const seeds=[];for(let i=0;i<46;i++)seeds.push({e:img('seed.png',70),a:R()*Math.PI*2,d:120+R()*380,rot:R()*360,sp:(R()-.5)*500,s:.8+R()*.7});
const mints=[0,1,2].map(i=>({e:img('mint.png',300),x:[380,700,560][i],y:[640,610,800][i],r:[-25,30,5][i],s:[1,.85,1.2][i]}));
const ices=[0,1,2].map(i=>({e:img('ice.png',260),x:[330,760,545][i],y:[560,600,760][i],r:[-12,18,4][i],d:i*.22}));
// mini versions that swirl into the drop
const minis=[['lemon_wedge.png',150],['seed.png',60],['mint.png',130],['ice.png',120],['lemon_wedge.png',120],['seed.png',60],['mint.png',110],['seed.png',55]].map(([s,w],i)=>({e:img(s,w,'items2'),a:i/8*Math.PI*2}));
// bottles + orbiting lemons/seeds
function makeBottle(fl){const d=document.createElement('div');d.className='bottle';
  d.innerHTML=`<div style="position:absolute;left:-40px;top:960px;width:480px;height:80px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.35),rgba(0,0,0,0))"></div>
  <div class="rot" style="position:absolute;left:33px;top:0;width:333px;height:1000px">
   <img src="assets/bottle_${fl}.png" style="position:absolute;inset:0;width:333px;height:1000px">
   <div class="gl" style="position:absolute;inset:0;-webkit-mask-image:url(assets/bottle_${fl}.png);mask-image:url(assets/bottle_${fl}.png);-webkit-mask-size:100% 100%;mask-size:100% 100%;background:linear-gradient(100deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.6) 50%,rgba(255,255,255,0) 60%);background-size:300% 100%;mix-blend-mode:screen"></div></div>`;
  $('bottles').appendChild(d);return{d,rot:d.querySelector('.rot'),gl:d.querySelector('.gl'),fl}}
const B1=makeBottle('classic'),B2=makeBottle('jeera');
function setBottle(B,o,x,y,s,deg=0,rot=0,blur=0){if(o<=.001){B.d.style.display='none';return}B.d.style.display='block';B.d.style.opacity=o;
  B.d.style.transform=`translate(${x-200}px,${y-1000}px) scale(${s}) rotate(${rot}deg)`;B.d.style.filter=blur?`blur(${blur}px)`:'none';
  B.rot.style.transform=`perspective(1800px) rotateY(${deg}deg)`;B.gl.style.backgroundPosition=`${100-((RT*45+(B.fl==='jeera'?60:0))%160)}% 0`}
const orb=[...Array(6)].map((_,i)=>({e:img(i%2?'lemon_wedge.png':'mint.png',i%2?170:150,'items2'),a:i/6*Math.PI*2}));
const orbJ=[...Array(14)].map((_,i)=>({e:img('seed.png',70,'items2'),a:i/14*Math.PI*2,rr:.8+((i*37)%10)/25}));
// rays
const rays=$('rays');const rayG=el('g',{},rays);const rayP=[];for(let i=0;i<18;i++){const a0=i/18*Math.PI*2,a1=a0+Math.PI/36,L=1700;rayP.push(el('path',{d:`M0 0L${L*Math.cos(a0)} ${L*Math.sin(a0)}L${L*Math.cos(a1)} ${L*Math.sin(a1)}Z`},rayG))}

/* ---------- backgrounds per beat ---------- */
const BG=[[0,'#FFF4C2','#FFE27A'],[2,'#B9CAD6','#5F7384'],[4,'#F6E6CF','#E3C49A'],[6,'#E6F6E8','#BFE3C6'],[7,'#E3F4FD','#A9D8F2'],[8,'#FFF8E7','#F6E4BE'],[10,'#FFE35C','#F59A2A'],[13,'#B06A32','#5E3010'],[15,'#F9923F','#B8430A'],[17.2,'#FFFDF4','#F6E4BE']];
function bgAt(t){let b=BG[0];for(const x of BG)if(t>=x[0])b=x;return `radial-gradient(circle at 50% 42%, ${b[1]} 0%, ${b[2]} 100%)`}

function renderCore(t){
  $('bg').style.background=bgAt(t);
  const punch=[0.6,2.35,4.2,6.2,7.25,9.7].some(p=>t>=p&&t<p+.12)?1+.03*Math.abs(Math.sin((t%1)*60)):1;
  $('stage').style.transform=`scale(${punch})`;
  $('flash').style.opacity=[9.7,10.0,13.0,17.2].reduce((m,p)=>Math.max(m,t>=p&&t<p+.25?(1-(t-p)/.25)*.7:0),0);

  /* hook: question + lemon lands */
  show(tx.q,seg(t,.05,.25)*(1-seg(t,7.8,8.0)),0,lerp(-40,0,eOut(seg(t,.05,.4))));
  { const fall=seg(t,0,.6),out=seg(t,1.85,2.1); put(lemon,1-out,540-out*900,lerp(-300,720,eIn(fall)),1+.08*Math.sin(t*3),lerp(-200,-8,eOut(fall))-out*40) }
  show(tx.w1,seg(t,.62,.75)*(1-seg(t,1.85,2.0)),0,0,lerp(1.5,1,eBack(seg(t,.62,.95))));
  // splash droplets at lemon landing and at drop landing
  const spT=t>=.6&&t<1.6?t-.6:(t>=9.7&&t<10.7?t-9.7:-1);
  ring.style.display=spT>=0?'block':'none';drops.forEach(d=>d.e.style.display=spT>=0?'block':'none');
  if(spT>=0){const cy=t<5?760:1100;ring.setAttribute('cy',cy);ring.setAttribute('rx',eOut(seg(spT,0,.6))*520);ring.setAttribute('ry',eOut(seg(spT,0,.6))*110);ring.setAttribute('opacity',1-seg(spT,0,.6));
    drops.forEach(d=>{d.e.setAttribute('cx',540+Math.cos(d.a)*d.v*spT);d.e.setAttribute('cy',cy+Math.sin(d.a)*d.v*spT+1500*spT*spT);d.e.setAttribute('r',d.r*(1-seg(spT,.3,1)))})}

  /* salt rain */
  const so=t>=2&&t<4.15;saltG.style.display=so?'block':'none';
  if(so){const out=seg(t,3.85,4.1);salts.forEach(s=>{const p=seg(t,2.0+s.delay*.5,2.55+s.delay*.5);const y=lerp(-80,s.land,eIn(p))+(p>=1?Math.sin((t-2.6)*20)*2*(1-seg(t,2.6,2.9)):0);
    s.g.setAttribute('transform',`translate(${s.x-out*1000} ${y}) rotate(${s.rot+s.sp*p})`);s.g.setAttribute('opacity',p>0?1:0)})}
  show(tx.w2,seg(t,2.3,2.45)*(1-seg(t,3.85,4.0)),0,0,lerp(1.5,1,eBack(seg(t,2.3,2.65))));

  /* jeera burst */
  seeds.forEach(s=>{if(t<4||t>=6.1){s.e.style.display='none';return}const p=eOut(seg(t,4.15,4.9)),out=seg(t,5.85,6.1);const a=s.a+seg(t,4.9,6)*.3;
    put(s.e,1-out,540+Math.cos(a)*s.d*p,720+Math.sin(a)*s.d*p*.8,s.s*(1-out*.5),s.rot+t*s.sp*.2)});
  show(tx.w3,seg(t,4.2,4.35)*(1-seg(t,5.85,6.0)),0,0,lerp(1.5,1,eBack(seg(t,4.2,4.55))));

  /* mint float */
  mints.forEach((m,i)=>{if(t<6||t>=7.2){m.e.style.display='none';return}const p=eOut(seg(t,6.0+i*.12,6.6+i*.12)),out=seg(t,6.95,7.15);
    put(m.e,p*(1-out),m.x,lerp(m.y+500,m.y,p)+Math.sin(t*3+i)*12-out*300,m.s,m.r+Math.sin(t*2+i)*6)});
  show(tx.w4,seg(t,6.2,6.35)*(1-seg(t,6.95,7.05)),0,0,lerp(1.5,1,eBack(seg(t,6.2,6.55))));
  /* ice drop + clink */
  ices.forEach(c=>{if(t<7||t>=8.2){c.e.style.display='none';return}const p=seg(t,7.0+c.d,7.35+c.d),b=eEl(seg(t,7.0+c.d,7.8+c.d));const out=seg(t,7.95,8.15);
    put(c.e,(p>0?1:0)*(1-out),c.x,lerp(-200,c.y,b),1.1,c.r+(1-b)*40)});
  show(tx.w5,seg(t,7.25,7.4)*(1-seg(t,7.95,8.05)),0,0,lerp(1.5,1,eBack(seg(t,7.25,7.6))));

  /* merge into the drop */
  minis.forEach((m,i)=>{if(t<8||t>=9.3){m.e.style.display='none';return}const p=seg(t,8.0,9.2);const a=m.a+p*Math.PI*2.2;const r=lerp(430,0,eIn(p));
    put(m.e,1-seg(t,9.0,9.25),540+Math.cos(a)*r,720+Math.sin(a)*r*.9,lerp(1,.2,eIn(p)),t*120+i*40)});
  show(tx.eq,seg(t,8.1,8.3)*(1-seg(t,9.5,9.7)),0,0,lerp(1.3,1,eOut(seg(t,8.1,8.4))));
  const dIn=seg(t,8.7,9.2);
  if(t>=8.7&&t<10.0){const fall=seg(t,9.35,9.7);put($('drop'),1-seg(t,9.68,9.72),540,lerp(720,1150,eIn(fall)),eBack(dIn)*(1+.04*Math.sin(t*10)),0)}
  else $('drop').style.display='none';

  /* rays */
  let ro=0,rc='#FFF6B0';
  if(t>=10&&t<13){ro=seg(t,10,10.3)*(1-seg(t,12.8,13));rc='#FFF6B0'}
  else if(t>=13&&t<15){ro=seg(t,13,13.3)*(1-seg(t,14.8,15));rc='#C27A3E'}
  else if(t>=15&&t<17.2){ro=seg(t,15,15.3)*(1-seg(t,17,17.2));rc='#FF8A3D'}
  rays.style.display=ro>0?'block':'none';rays.style.opacity=ro*.55;rayG.setAttribute('transform',`translate(540 1150) rotate(${RT*12})`);rayP.forEach(p=>p.setAttribute('fill',rc));

  /* classic */
  if(t>=10&&t<13.35){const up=eBack(seg(t,10.0,10.7)),wh=eIn(seg(t,13.0,13.35));
    setBottle(B1,1,540-wh*1500,lerp(2900,1720,up),1.1,lerp(-30,0,eOut(seg(t,10,11)))+Math.sin(t*1.6)*4,lerp(-6,0,eOut(seg(t,10,10.8)))-wh*10,wh*14)}
  else if(t>=15&&t<17.5){const up=eBack(seg(t,15.0,15.6)),out=seg(t,17.1,17.4);setBottle(B1,1-out,330,lerp(2900,1780,up),.9,Math.sin(t*1.6)*4,-4)}
  else setBottle(B1,0);
  show(tx.c1,seg(t,10.5,10.7)*(1-seg(t,12.95,13.05)),lerp(-700,0,eOut(seg(t,10.5,10.9))),0);
  show(tx.c2,seg(t,10.65,10.85)*(1-seg(t,12.95,13.05)),lerp(700,0,eOut(seg(t,10.65,11.05))),0);
  orb.forEach((o,i)=>{if(t<10.2||t>=13.1){o.e.style.display='none';return}const a=o.a+t*.7;const p=eOut(seg(t,10.2,10.9));
    put(o.e,p*(1-seg(t,12.9,13.1)),540+Math.cos(a)*400*p,1180+Math.sin(a)*330*p,1,t*30+i*50)});

  /* jeera */
  if(t>=13&&t<15.2){const inn=eOut(seg(t,13.05,13.45)),out=eIn(seg(t,14.85,15.15));
    setBottle(B2,1,540+(1-inn)*1500,1720+out*1400,1.1,lerp(30,0,eOut(seg(t,13.05,14)))+Math.sin(t*1.6)*4,(1-inn)*10,(1-inn)*14)}
  else if(t>=15&&t<17.5){const up=eBack(seg(t,15.15,15.75)),out=seg(t,17.1,17.4);setBottle(B2,1-out,750,lerp(2900,1780,up),.9,Math.sin(t*1.6+1)*4,4)}
  else setBottle(B2,0);
  show(tx.j1,seg(t,13.4,13.6)*(1-seg(t,14.85,15.0)),0,lerp(-100,0,eOut(seg(t,13.4,13.8))),lerp(1.4,1,eOut(seg(t,13.4,13.8))));
  show(tx.j2,seg(t,13.55,13.75)*(1-seg(t,14.85,15.0)),0,0,lerp(1.6,1,eBack(seg(t,13.55,13.95))));
  orbJ.forEach((o,i)=>{if(t<13.2||t>=15.1){o.e.style.display='none';return}const a=o.a+t*.9;const p=eOut(seg(t,13.2,13.9));
    put(o.e,p*(1-seg(t,14.85,15.05)),540+Math.cos(a)*380*o.rr*p,1180+Math.sin(a)*330*o.rr*p,1.2,t*90+i*40)});

  /* words */
  [[tx.r1,15.5],[tx.r2,16.05],[tx.r3,16.6]].forEach(([e,s])=>show(e,seg(t,s,s+.08)*(1-seg(t,17.05,17.2)),0,0,lerp(2.2,1,eBack(seg(t,s,s+.3)))));

  /* end card */
  if(t>=17.2){const dp=seg(t,17.3,17.8);put($('drop'),seg(t,17.3,17.4),540,430+Math.sin(t*3)*8*seg(t,17.9,18.3),eEl(dp),0);
    const w=seg(t,17.6,17.95);$('word').style.display=w>0?'block':'none';$('word').style.opacity=w;$('word').style.transform=`translate(${540-360}px,${lerp(720,650,eOut(w))}px)`}
  else $('word').style.display='none';
  show(tx.tag,seg(t,17.9,18.15),0,lerp(40,0,eOut(seg(t,17.9,18.25))));
  show(tx.cta,seg(t,18.2,18.4),0,0,lerp(.6,1,eBack(seg(t,18.2,18.6))));
  show(tx.wa,seg(t,18.45,18.7),0,lerp(30,0,eOut(seg(t,18.45,18.8))));
  show(tx.fl,seg(t,18.7,18.95),0,lerp(30,0,eOut(seg(t,18.7,19.05))));
}

const MAP=[[3,0],[5,2],[7,4],[9,6],[11,7],[13,8],[15.5,10],[16.5,11],[18.7,12.7],[19,13],[20,14],[21.8,14.8],[22,15],[24,17],[24.8,17.05],[25,17.2],[26.7,18.9],[30,20]];
function oldT(n){for(let i=1;i<MAP.length;i++){const[a0,b0]=MAP[i-1],[a1,b1]=MAP[i];if(n<=a1)return b0+(b1-b0)*(n-a0)/(a1-a0)}return 20}
function render(n){RT=n;
  if(n<3){renderCore(-1);
    $('bg').style.background='radial-gradient(circle at 50% 45%, #FFFDF4 0%, #F6E4BE 100%)';
    const zin=seg(n,0,2.4),blast=eIn(seg(n,2.4,3.0));
    setBottle(B1,1-seg(n,2.8,3.0),540,lerp(2350,2250,eOut(zin))+blast*900,lerp(2.0,2.3,eOut(zin))+blast*3,lerp(-14,6,eIO(zin)),0,blast*10);
    show(tx.q,seg(n,.25,.45),0,lerp(-40,0,eOut(seg(n,.25,.6))),lerp(1.3,1,eBack(seg(n,.25,.6))));
    $('flash').style.opacity=n>=2.75?seg(n,2.75,3.0)*.9:0;
    $('stage').style.transform='scale(1)';
    return}
  renderCore(oldT(n));
  if(n<3.25)$('flash').style.opacity=Math.max(parseFloat($('flash').style.opacity)||0,(1-seg(n,3,3.25))*.9);
}
window.render=render;window.DUR=DUR;
const q=new URLSearchParams(location.search);
if(q.has('t'))render(parseFloat(q.get('t')));
else if(!q.has('capture')){let t0=null;const loop=ts=>{if(t0===null)t0=ts;render(((ts-t0)/1000)%DUR);requestAnimationFrame(loop)};requestAnimationFrame(loop)}
</script></body></html>
