<!doctype html>
<html><head><meta charset="utf-8"><title>Taazu Reel</title>
<link rel="stylesheet" href="assets/fonts/local.css">
<style>
:root{--cream:#FFF8E7;--orange:#EA580C;--yellow:#F5D83B;--green:#1F7A3A;--brown:#8A4B1F}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--orange)}
.abs{position:absolute;left:0;top:0;will-change:transform,opacity}
.layer{position:absolute;inset:0}
.txt{position:absolute;left:0;width:1080px;text-align:center;white-space:nowrap}
.bc{font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase}
.bl{font-family:'Baloo 2',sans-serif;font-weight:800}
.pp{font-family:'Poppins',sans-serif;font-weight:700}
.bottle{position:absolute;width:400px;height:1010px;left:0;top:0;transform-origin:200px 1000px}
</style></head>
<body><div id="stage">
  <div id="bg" class="layer"></div>
  <svg id="heat" class="layer" viewBox="0 0 1080 1920"></svg>
  <svg id="rays" class="layer" viewBox="0 0 1080 1920"></svg>
  <div id="wipe" class="layer" style="background:var(--cream)"></div>
  <svg id="fx" class="layer" viewBox="0 0 1080 1920"></svg>
  <div id="bottles" class="layer"></div>
  <svg id="pieces" class="layer" viewBox="0 0 1080 1920"></svg>
  <img id="drop" class="abs" src="assets/drop_solid.png" style="width:310px">
  <div id="texts" class="layer"></div>
  <img id="endDrop" class="abs" src="assets/drop_solid.png" style="width:330px">
  <img id="endWord" class="abs" src="assets/wordmark.png" style="width:760px">
  <div id="garba" class="layer" style="display:none;overflow:hidden">
    <svg id="gsvg" class="layer" viewBox="0 0 1080 1920"></svg>
    <div id="gt1" class="txt bc" style="top:470px;font-size:84px;letter-spacing:16px;color:var(--yellow)">NAVRATRI NIGHTS</div>
    <div id="gt2" class="txt bl" style="top:575px;font-size:150px;line-height:1;color:var(--cream)">3 ghante garba</div>
    <div id="gclock" class="txt bc" style="top:780px;font-size:96px;letter-spacing:6px;color:#FFB36B;font-weight:700">9:00 PM</div>
    <div id="gt3" class="txt pp" style="top:1690px;font-size:74px;color:var(--cream)">…aur gala sookha.</div>
  </div>
  <div id="montage" class="layer" style="display:none;overflow:hidden">
    <svg id="msvg" class="layer" viewBox="0 0 1080 1920"></svg>
    <div id="mword" class="txt bc" style="top:1060px;font-size:300px;letter-spacing:12px;line-height:1"></div>
    <div id="mcap" class="txt pp" style="top:1560px;font-size:64px;color:var(--cream)">Paseena har jagah.</div>
  </div>
  <div id="flash" class="layer" style="background:#fff;opacity:0"></div>
</div>
<script>
const DUR=30, CX=540; let RT=0;
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,p)=>a+(b-a)*p;
const eOut=p=>1-Math.pow(1-p,3), eIn=p=>p*p*p, eIO=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const eBack=p=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
const eEl=p=>p===0?0:p===1?1:Math.pow(2,-10*p)*Math.sin((p*10-.75)*(2*Math.PI)/3)+1;
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}

/* ---------- texts ---------- */
function T(id,html,cls,top,style=''){const d=document.createElement('div');d.id=id;d.className='txt '+cls;d.style.cssText=`top:${top}px;${style}`;d.innerHTML=html;$('texts').appendChild(d);return d}
const tx={
  amd:T('amd','AMDAVAD','bc',360,'font-size:120px;letter-spacing:22px;color:var(--cream)'),
  deg:T('deg','44°','bl',470,'font-size:420px;line-height:1;color:var(--cream);text-shadow:0 18px 0 rgba(120,30,0,.25)'),
  sub:T('sub','Garmi. Garba. Thakaan.','pp',1010,'font-size:58px;color:var(--cream);opacity:.95'),
  pas:T('pas','Paseena gaya…','pp',1480,'font-size:78px;color:var(--cream)'),
  aaya:T('aaya','<span style="font-family:Poppins;font-weight:700;font-size:78px;color:var(--green);display:block;margin-bottom:-30px">…aur aaya</span>TAAZU','bl',640,'font-size:250px;line-height:1;color:var(--orange)'),
  c1:T('c1','CLASSIC','bc',120,'font-size:130px;letter-spacing:14px;color:var(--green)'),
  c2:T('c2','NIMBU NAMAK','bc',235,'font-size:170px;letter-spacing:6px;color:var(--orange)'),
  c3:T('c3','<span style="background:var(--green);color:var(--cream);padding:14px 38px;border-radius:60px">Nimbu ka asli swaad · No fizz</span>','pp',1710,'font-size:46px'),
  j1:T('j1','JEERA','bc',120,'font-size:150px;letter-spacing:18px;color:var(--yellow)'),
  j2:T('j2','MASALA','bc',255,'font-size:170px;letter-spacing:14px;color:var(--cream)'),
  j3:T('j3','<span style="background:var(--cream);color:var(--brown);padding:14px 38px;border-radius:60px">Desi masala twist · No fizz</span>','pp',1710,'font-size:46px'),
  w1:T('w1','REHYDRATE','bc',150,'font-size:160px;letter-spacing:10px;color:var(--cream)'),
  w2:T('w2','REFRESH','bc',320,'font-size:160px;letter-spacing:10px;color:var(--yellow)'),
  w3:T('w3','RECOVER','bc',490,'font-size:160px;letter-spacing:10px;color:var(--cream)'),
  tag:T('tag','REHYDRATE&nbsp;|&nbsp;REFRESH&nbsp;|&nbsp;RECOVER','bc',1130,'font-size:62px;letter-spacing:9px;color:var(--orange);font-weight:700'),
  cta:T('cta','<span style="background:var(--green);color:var(--cream);padding:22px 50px;border-radius:80px;display:inline-block">Navratri stalls me milenge!</span>','pp',1300,'font-size:52px'),
  fl:T('fl','Classic Nimbu Namak &nbsp;·&nbsp; Jeera Masala','pp',1470,'font-size:44px;color:var(--brown);font-weight:500'),
  nc:T('nc','NON-CARBONATED &nbsp;·&nbsp; 250 ML','bc',1545,'font-size:44px;letter-spacing:8px;color:#9a7a5a;font-weight:600'),
};
function show(e,o,x=0,y=0,s=1,extra=''){e.style.opacity=o;e.style.transform=`translate(${x}px,${y}px) scale(${s}) ${extra}`;e.style.display=o<=0.001?'none':'block'}

/* ---------- heat scene ---------- */
const heat=$('heat');
const sunG=el('radialGradient',{id:'sunG'},el('defs',{},heat));
el('stop',{offset:'0','stop-color':'#FFF3A0'},sunG);el('stop',{offset:'.55','stop-color':'#F5D83B'},sunG);el('stop',{offset:'1','stop-color':'#F5D83B','stop-opacity':'0'},sunG);
const sun=el('circle',{cx:540,cy:1460,r:360,fill:'url(#sunG)'},heat);
const sunCore=el('circle',{cx:540,cy:1460,r:190,fill:'#FBE56A'},heat);
const waves=[];for(let i=0;i<7;i++)waves.push(el('path',{fill:'none',stroke:'#FFF8E7','stroke-width':10,'stroke-linecap':'round',opacity:.35},heat));

/* ---------- rays ---------- */
const rays=$('rays');const rayG=el('g',{},rays);const rayPaths=[];
for(let i=0;i<18;i++){const a0=i/18*Math.PI*2,a1=a0+Math.PI/36,R=1600;rayPaths.push(el('path',{d:`M0 0 L${R*Math.cos(a0)} ${R*Math.sin(a0)} L${R*Math.cos(a1)} ${R*Math.sin(a1)}Z`},rayG))}

/* ---------- fx (splash) ---------- */
const fx=$('fx');const rings=[0,1,2].map(i=>el('circle',{cx:540,cy:960,r:0,fill:'none',stroke:['#F5D83B','#EA580C','#7CC4F0'][i],'stroke-width':18},fx));
const R1=rng(7);const drops=[];for(let i=0;i<34;i++){const a=R1()*Math.PI*2,v=500+R1()*900;drops.push({a,v,r:6+R1()*16,e:el('circle',{fill:i%3?'#CFEAFB':'#FFFFFF',stroke:'#9CCFEF','stroke-width':2},fx)})}

/* ---------- pieces: lemon, mint, ice, jeera ---------- */
const pieces=$('pieces');
function lemon(g){el('circle',{r:62,fill:'#F2C318'},g);el('circle',{r:54,fill:'#FFF6C9'},g);el('circle',{r:48,fill:'#F9DE4B'},g);for(let k=0;k<8;k++){const a=k/8*Math.PI*2;el('line',{x1:0,y1:0,x2:48*Math.cos(a),y2:48*Math.sin(a),stroke:'#FFF6C9','stroke-width':5},g)}el('circle',{r:7,fill:'#FFF6C9'},g);el('ellipse',{cx:-18,cy:-22,rx:14,ry:6,fill:'#fff',opacity:.55,transform:'rotate(-35)'},g)}
function mint(g){el('path',{d:'M0 -60 C38 -40 44 20 0 60 C-44 20 -38 -40 0 -60Z',fill:'#2E9A48'},g);el('path',{d:'M0 -52 L0 56',stroke:'#1F7A3A','stroke-width':4},g);for(let k=-2;k<=2;k++){el('path',{d:`M0 ${k*18} L22 ${k*18-14}`,stroke:'#1F7A3A','stroke-width':3},g);el('path',{d:`M0 ${k*18} L-22 ${k*18-14}`,stroke:'#1F7A3A','stroke-width':3},g)}el('path',{d:'M-10 -30 C-20 -10 -18 10 -8 26',stroke:'#7FD08F','stroke-width':4,fill:'none',opacity:.6},g)}
function ice(g){el('rect',{x:-44,y:-44,width:88,height:88,rx:16,fill:'#DDF1FF',opacity:.85,stroke:'#fff','stroke-width':4},g);el('rect',{x:-30,y:-32,width:30,height:12,rx:6,fill:'#fff',opacity:.9},g);el('rect',{x:-44,y:20,width:88,height:24,rx:10,fill:'#9FD2F2',opacity:.6},g)}
function seed(g){el('ellipse',{rx:7,ry:22,fill:'#7A4A22'},g);el('path',{d:'M0 -18 L0 18',stroke:'#5A3314','stroke-width':2},g);el('path',{d:'M-3 -14 L-3 14 M3 -14 L3 14',stroke:'#A36A35','stroke-width':1.5},g)}
const R2=rng(21);
// burst pieces from splash: land in a halo around centre
const burst=[];const kinds=[lemon,mint,ice,lemon,mint,lemon,ice,mint,lemon,mint];
kinds.forEach((fn,i)=>{const g=el('g',{},pieces);fn(g);const a=i/kinds.length*Math.PI*2+R2()*.4;burst.push({g,a,d:380+R2()*160,s:.8+R2()*.6,rot:(R2()-.5)*720,ph:R2()*6})});
const seeds=[];for(let i=0;i<34;i++){const g=el('g',{},pieces);seed(g);seeds.push({g,a:R2()*Math.PI*2,d:360+R2()*460,s:.8+R2()*1.2,rot:R2()*360,sp:(R2()-.5)*400})}

/* ---------- bottles ---------- */
function makeBottle(id,fl){
  const src=`assets/bottle_${fl}.png`;
  const d=document.createElement('div');d.className='bottle';d.id=id;
  d.innerHTML=`<div style="position:absolute;left:-40px;top:960px;width:480px;height:80px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.35),rgba(0,0,0,0))"></div>
   <div class="rot" style="position:absolute;left:33px;top:0;width:333px;height:1000px;transform-style:preserve-3d">
    <img src="${src}" style="position:absolute;inset:0;width:333px;height:1000px">
    <div class="glint" style="position:absolute;inset:0;-webkit-mask-image:url(${src});mask-image:url(${src});-webkit-mask-size:100% 100%;mask-size:100% 100%;background:linear-gradient(100deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 60%);background-size:300% 100%;mix-blend-mode:screen"></div>
   </div>`;
  $('bottles').appendChild(d);
  return {d,rot:d.querySelector('.rot'),gl:d.querySelector('.glint'),fl};
}
const B1=makeBottle('b1','classic'),B2=makeBottle('b2','jeera');
function setBottle(B,o,x,y,s,deg,rot=0,blur=0){
  if(o<=0.001){B.d.style.display='none';return}
  B.d.style.display='block';B.d.style.opacity=o;
  B.d.style.transform=`translate(${x-200}px,${y-1000}px) scale(${s}) rotate(${rot}deg)`;
  B.d.style.filter=blur?`blur(${blur}px)`:'none';
  B.rot.style.transform=`perspective(1800px) rotateY(${deg*.6}deg)`;
  B.gl.style.backgroundPosition=`${100-((RT*40+(B.fl==='jeera'?50:0))%160)}% 0`;
}
/* ---------- render(t) ---------- */
function bgAt(t){
  if(t<3.5){const k=seg(t,2.2,3.4);return `radial-gradient(circle at 50% 70%, ${k>0?'#F07A2A':'#F59A3C'} 0%, #EA580C 45%, #A83A05 100%)`}
  if(t<8.15) return 'radial-gradient(circle at 50% 55%, #FFFDF4 0%, #FFF8E7 55%, #F8E6C0 100%)';
  if(t<10.3) return 'radial-gradient(circle at 50% 55%, #B06A32 0%, #8A4B1F 55%, #5E3010 100%)';
  if(t<12.7) return 'radial-gradient(circle at 50% 50%, #F9923F 0%, #EA580C 55%, #B8430A 100%)';
  return 'radial-gradient(circle at 50% 40%, #FFFDF4 0%, #FFF8E7 60%, #F6E4BE 100%)';
}
function renderCore(t){
  $('bg').style.background=bgAt(t);
  // shake during heat
  const shake=t>1.2&&t<2.2?Math.sin(t*90)*6*(1-seg(t,1.2,2.2)):0;
  $('stage').style.transform=`translate(${shake}px,${shake*.6}px)`;

  /* heat */
  const hv=t<3.6;heat.style.display=hv?'block':'none';
  if(hv){const pulse=1+.05*Math.sin(t*7);const ho=1-seg(t,2.6,3.4);heat.style.opacity=ho;
    const rise=eOut(seg(t,0,1));sun.setAttribute('r',360*pulse*rise);sunCore.setAttribute('r',190*pulse*rise);
    sun.setAttribute('cy',lerp(1900,1460,rise));sunCore.setAttribute('cy',lerp(1900,1460,rise));
    waves.forEach((w,i)=>{const y0=((1900-((t*260+i*300)%2100)));let d=`M-40 ${y0}`;for(let x=-40;x<=1120;x+=40){d+=` L${x} ${y0+Math.sin(x/70+t*6+i)*16}`}w.setAttribute('d',d)})}

  /* heat texts */
  const hOut=1-seg(t,1.95,2.25);
  show(tx.amd,seg(t,.1,.45)*hOut,lerp(-300,0,eOut(seg(t,.1,.5))),0);
  const dk=seg(t,.35,1.35);tx.deg.textContent=Math.round(lerp(32,44,eOut(dk)))+'°';
  show(tx.deg,seg(t,.3,.5)*hOut,0,0,lerp(.6,1,eBack(seg(t,.3,.8)))*(t>1.35?1+.04*Math.sin(t*30)*(1-seg(t,1.35,1.9)):1));
  show(tx.sub,seg(t,1.0,1.3)*hOut,0,lerp(40,0,eOut(seg(t,1.0,1.4))));

  /* drop falls */
  const df=seg(t,2.15,3.4);
  if(t>=2.1&&t<3.75){const y=lerp(-460,720,eIn(df)*.85+df*.15);const imp=seg(t,3.4,3.7);
    const st=1+.18*df*(1-imp);const sc=1+imp*1.6;
    $('drop').style.display='block';$('drop').style.opacity=1-imp;
    $('drop').style.transform=`translate(${540-155}px,${y}px) scale(${sc/st*1},${sc*st})`;
  } else $('drop').style.display='none';
  show(tx.pas,seg(t,2.35,2.6)*(1-seg(t,3.35,3.5)),0,lerp(30,0,eOut(seg(t,2.35,2.7))));

  /* impact flash + wipe to cream */
  $('flash').style.opacity=t>=3.4&&t<3.8?(1-seg(t,3.4,3.75))*.85:(t>=12.6&&t<12.95?(1-seg(t,12.6,12.9))*.6:0);
  let wr=0,wc='#FFF8E7';
  if(t>=3.4&&t<3.95){wr=1500*eOut(seg(t,3.4,3.9))}
  if(t>=12.6&&t<13.1){wr=1500*eOut(seg(t,12.6,13.05))}
  $('wipe').style.display=wr>0?'block':'none';$('wipe').style.clipPath=`circle(${wr}px at 540px 960px)`;

  /* splash rings + droplets */
  const sp=seg(t,3.4,4.6);fx.style.display=sp>0&&sp<1?'block':'none';
  if(sp>0&&sp<1){rings.forEach((r,i)=>{const p=seg(t,3.4+i*.08,4.3+i*.1);r.setAttribute('r',eOut(p)*(700+i*120));r.setAttribute('opacity',1-p);r.setAttribute('stroke-width',26*(1-p)+2)});
    const ts=t-3.4;drops.forEach(o=>{const x=540+Math.cos(o.a)*o.v*ts,y=960+Math.sin(o.a)*o.v*ts+1400*ts*ts;o.e.setAttribute('cx',x);o.e.setAttribute('cy',y);o.e.setAttribute('r',o.r*(1-sp*.6))})}

  /* burst pieces (fruit) */
  let bo=0,cx=540,cy=960,spread=1;
  if(t>=3.4&&t<8.2){bo=seg(t,3.4,3.5)*(1-seg(t,7.9,8.15));}
  else if(t>=10.3&&t<12.75){bo=seg(t,10.3,10.6)*(1-seg(t,12.5,12.7));cy=1150;spread=1.25}
  pieces.style.display=bo>0?'block':'none';
  burst.forEach((b,i)=>{
    if(bo<=0){b.g.style.display='none';return}b.g.style.display='block';
    let p,ang=b.a;
    if(t<8.2){p=eOut(seg(t,3.4,4.3));ang+=seg(t,4.3,8.2)*.8;}
    else{p=eOut(seg(t,10.3,11.0));ang+=seg(t,11,12.7)*-.6;}
    const dd=b.d*spread*p, bob=Math.sin(RT*2.2+b.ph)*14;
    // during classic scene keep them clear of bottle vertically centred lower
    const oy=t>=5.4&&t<8.2?lerp(0,180,seg(t,5.4,6)):0;
    b.g.setAttribute('transform',`translate(${cx+Math.cos(ang)*dd*1.05} ${cy+oy+Math.sin(ang)*dd*1.5+bob}) rotate(${b.rot*p+RT*20}) scale(${b.s*(t>=10.3?.8:1)})`);
    b.g.setAttribute('opacity',bo);
  });
  // jeera seeds
  const so=t>=8.25&&t<10.35?seg(t,8.25,8.35)*(1-seg(t,10.1,10.3)):0;
  seeds.forEach(s=>{if(so<=0){s.g.style.display='none';return}s.g.style.display='block';
    const p=eOut(seg(t,8.3,9.1));const a=s.a+seg(t,9.1,10.3)*.4;
    s.g.setAttribute('transform',`translate(${540+Math.cos(a)*s.d*p} ${1080+Math.sin(a)*s.d*p*1.3}) rotate(${s.rot+t*s.sp*.3}) scale(${s.s*1.3})`);s.g.setAttribute('opacity',so)});
  if(so>0)pieces.style.display='block';

  /* texts: aaya */
  const aIn=seg(t,3.7,4.05),aOut=seg(t,5.2,5.5);
  show(tx.aaya,aIn*(1-aOut),0,lerp(0,-420,eIO(aOut)),lerp(1.7,1,eBack(aIn))*(1-aOut*.3));

  /* rays */
  let ro=0,rc='#F5D83B',rcx=540,rcy=1100,ra=.55;
  if(t>=5.4&&t<8.2){ro=seg(t,5.4,5.9)*(1-seg(t,7.95,8.15));rc='#F5D83B';ra=.5}
  else if(t>=8.15&&t<10.35){ro=seg(t,8.2,8.5)*(1-seg(t,10.1,10.3));rc='#C27A3E';ra=.55}
  else if(t>=10.3&&t<12.7){ro=seg(t,10.3,10.6)*(1-seg(t,12.4,12.65));rc='#FF8A3D';ra=.6;rcy=1250}
  rays.style.display=ro>0?'block':'none';rays.style.opacity=ro*ra;
  rayG.setAttribute('transform',`translate(${rcx} ${rcy}) rotate(${RT*14}) scale(${lerp(.3,1,eOut(ro))})`);rayPaths.forEach(p=>p.setAttribute('fill',rc));

  /* classic bottle */
  if(t>=5.4&&t<8.5){const up=eBack(seg(t,5.4,6.1)),wh=eIn(seg(t,8.0,8.35));
    const deg=lerp(-40,0,eOut(seg(t,5.4,6.4)))+Math.sin((t-6.4)*2.4)*8*seg(t,6.4,6.8);
    setBottle(B1,1,540-wh*1500,lerp(2900,1640,up),1.18,deg,lerp(-8,0,eOut(seg(t,5.4,6.2)))-wh*10,wh*14);
  } else if(t>=10.3&&t<12.9){const up=eBack(seg(t,10.35,10.95)),out=seg(t,12.5,12.8);
    setBottle(B1,1-out,330,lerp(2900,1720,up)+out*60,.98*(1-out*.2),lerp(-30,10,eOut(seg(t,10.35,11.2)))+Math.sin(RT*1.8)*3,-4);
  } else setBottle(B1,0);
  show(tx.c1,seg(t,5.95,6.2)*(1-seg(t,7.95,8.1)),lerp(-700,0,eOut(seg(t,5.95,6.35))),0);
  show(tx.c2,seg(t,6.1,6.35)*(1-seg(t,7.95,8.1)),lerp(700,0,eOut(seg(t,6.1,6.5))),0);
  show(tx.c3,seg(t,6.6,6.85)*(1-seg(t,7.95,8.1)),0,lerp(80,0,eOut(seg(t,6.6,7))),lerp(.7,1,eBack(seg(t,6.6,7))));

  /* jeera bottle */
  if(t>=8.0&&t<10.45){const inn=eOut(seg(t,8.05,8.45)),out=eIn(seg(t,10.05,10.35));
    const deg=lerp(40,0,eOut(seg(t,8.05,8.9)))+Math.sin((t-8.9)*2.4)*7*seg(t,8.9,9.3);
