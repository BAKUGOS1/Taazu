                                             <line x1="0" y1="0" x2="-60.62177826491071" y2="-34.99999999999999" stroke="#FFF8E7" stroke-width="3.5"/><line x1="0" y1="0" x2="35.00000000000001" y2="60.6217782649107" stroke="#FFF8E7" stroke-width="3.5"/>
                                             <line x1="0" y1="0" x2="-35.00000000000001" y2="-60.6217782649107" stroke="#FFF8E7" stroke-width="3.5"/><line x1="0" y1="0" x2="4.2862637970157365e-15" y2="70" stroke="#FFF8E7" stroke-width="3.5"/>
                                             <line x1="0" y1="0" x2="-4.2862637970157365e-15" y2="-70" stroke="#FFF8E7" stroke-width="3.5"/><line x1="0" y1="0" x2="-34.999999999999986" y2="60.62177826491071" stroke="#FFF8E7" stroke-width="3.5"/>
                                             <line x1="0" y1="0" x2="34.999999999999986" y2="-60.62177826491071" stroke="#FFF8E7" stroke-width="3.5"/><line x1="0" y1="0" x2="-60.62177826491071" y2="34.99999999999999" stroke="#FFF8E7" stroke-width="3.5"/>
                                             <line x1="0" y1="0" x2="60.62177826491071" y2="-34.99999999999999" stroke="#FFF8E7" stroke-width="3.5"/>
        <circle cx="0" cy="0" r="10" fill="#FFF8E7"/>
